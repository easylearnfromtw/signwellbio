<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light">
<title>SIGN WELL · Daily Medical Focus</title>
<style>
:root{--ink:#0b1220;--muted:#65758b;--line:rgba(41,58,86,.10);--paper:rgba(255,255,255,.94);--blue:#5b86ec;--purple:#8e7ae8;--pink:#e67aa6;--green:#3b9b7a;--shadow:0 18px 60px rgba(71,94,132,.10);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#f5f7fc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 8% 8%,rgba(91,134,236,.14),transparent 31%),radial-gradient(circle at 88% 10%,rgba(142,122,232,.13),transparent 28%),radial-gradient(circle at 80% 86%,rgba(230,122,166,.10),transparent 30%),#f5f7fc}body{padding:clamp(14px,2vw,26px);overflow-x:hidden}.app{max-width:1180px;margin:auto}.glass{background:var(--paper);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:28px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:#6c7a91}.title{font-size:clamp(27px,4vw,44px);line-height:1.05;letter-spacing:-.04em;margin:5px 0 8px}.lead{margin:0;color:var(--muted);line-height:1.7;max-width:780px;font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--ink);min-height:40px;padding:0 15px;border-radius:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(60,80,120,.06)}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:wait;transform:none}.btn.primary{border-color:transparent;color:white;background:linear-gradient(135deg,var(--blue),var(--purple) 58%,var(--pink))}.status{display:flex;align-items:center;gap:9px;padding:12px 15px;margin-bottom:16px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:16px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#d5a05b;box-shadow:0 0 0 5px rgba(213,160,91,.11)}.status.ready .dot{background:var(--green);box-shadow:0 0 0 5px rgba(59,155,122,.11)}.status.error .dot{background:#d85f79;box-shadow:0 0 0 5px rgba(216,95,121,.11)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:20px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-2px);box-shadow:0 22px 70px rgba(71,94,132,.15)}.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.chip{display:inline-flex;align-items:center;min-height:25px;padding:0 9px;border-radius:999px;background:rgba(91,134,236,.08);color:#49699f;font-size:11px;font-weight:800}.chip.purple{background:rgba(142,122,232,.09);color:#6b59a8}.card h2{font-size:19px;line-height:1.35;margin:0 0 9px;letter-spacing:-.018em}.card p{margin:0;color:var(--muted);line-height:1.7;font-size:13px}.empty{padding:42px;text-align:center;color:var(--muted)}.detail{display:none}.detail.active{display:block}.list.hidden{display:none}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.paper{padding:clamp(18px,3vw,30px)}.paper h2{font-size:clamp(24px,3.4vw,36px);letter-spacing:-.035em;margin:6px 0 12px}.paper .summary{font-size:15px;line-height:1.8;color:#35455c}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.section h3{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#53627a;margin:0 0 10px}.source-list,.lit-list{display:grid;gap:9px}.source{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:15px;text-decoration:none;color:inherit;background:rgba(255,255,255,.62)}.source strong{font-size:13px;line-height:1.4}.source small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.writer{margin-top:18px;padding:18px;border-radius:21px;background:linear-gradient(135deg,rgba(230,239,255,.72),rgba(245,239,255,.72),rgba(255,239,246,.66));border:1px solid rgba(255,255,255,.8)}.writer-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.writer h3{margin:0;font-size:16px}.draft{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;min-height:90px;line-height:1.8;font-size:14px}.draft:empty:before{content:'生成後會在這裡顯示草稿預覽';color:#9aa6b6}.draft-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.errorbox{display:none;margin-top:14px;padding:13px 15px;border-radius:14px;background:rgba(216,95,121,.08);color:#a33c53;border:1px solid rgba(216,95,121,.16);white-space:pre-wrap}.errorbox.show{display:block}.skeleton{height:150px;border-radius:28px;background:linear-gradient(100deg,rgba(255,255,255,.5),rgba(255,255,255,.92),rgba(255,255,255,.5));background-size:200% 100%;animation:shine 1.2s linear infinite;border:1px solid rgba(255,255,255,.7)}@keyframes shine{to{background-position:-200% 0}}@media(max-width:760px){body{padding:12px}.top{display:block}.top .actions{margin-top:13px}.grid{grid-template-columns:1fr}.glass{border-radius:22px}.paper{padding:18px}.writer-head{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
<script id="sw-gpu-bootstrap">(()=>{try{const r=document.documentElement,c=navigator.connection||navigator.mozConnection||navigator.webkitConnection,m=Number(navigator.deviceMemory||8),h=Number(navigator.hardwareConcurrency||8),d=Number(devicePixelRatio||1),co=matchMedia('(pointer:coarse)').matches,na=matchMedia('(max-width:900px)').matches,rm=matchMedia('(prefers-reduced-motion:reduce)').matches,ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);let p=(rm||(c&&c.saveData)||m<=4||h<=4)?'lite':(co||na||ios||d>=2.5||m<=6||h<=6)?'balanced':'high';r.classList.add('sw-gpu-'+p);r.dataset.swGpuProfile=p}catch(_){}})();</script><link rel="stylesheet" href="assets/gpu-optimizer.css?build=r10-2-gpu"></head>
<body>
<main class="app">
  <section class="list" id="listView">
    <header class="top">
      <div><div class="eyebrow">SIGN WELL · DAILY MEDICAL FOCUS</div><h1 class="title">時事新聞建議</h1><p class="lead">從近 24 小時醫療焦點開始，保留來源與文獻，再把題目送進 SIGN WELL AI Writer。資料與發布動作都由父層 CMS 的已登入 bridge 執行；此頁不保存 Admin Key。</p></div>
      <div class="actions"><button class="btn" id="refreshBtn" type="button">重新掃描</button></div>
    </header>
    <div class="status" id="status"><i class="dot"></i><span id="statusText">正在讀取今日醫療焦點…</span></div>
    <div class="grid" id="grid"><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="errorbox" id="listError"></div>
  </section>
  <section class="detail" id="detailView">
    <div class="detail-head"><button class="btn" id="backBtn" type="button">‹ 返回焦點</button><div class="actions"><button class="btn" id="literatureBtn" type="button">更新 PubMed 文獻</button></div></div>
    <article class="paper glass" id="detailPaper"></article>
    <div class="errorbox" id="detailError"></div>
  </section>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(String(v||''),location.href);return /^https?:$/.test(u.protocol)?u.href:'#'}catch(_){return '#'}};
const listView=$('#listView'),detailView=$('#detailView'),grid=$('#grid'),status=$('#status'),statusText=$('#statusText'),listError=$('#listError'),detailError=$('#detailError'),detailPaper=$('#detailPaper'),refreshBtn=$('#refreshBtn'),backBtn=$('#backBtn'),literatureBtn=$('#literatureBtn');
let topics=[],current=null,draft=null,variation=0,busy=false;
function setStatus(text,state=''){status.className='status'+(state?' '+state:'');statusText.textContent=text}
function error(el,msg){el.textContent=String(msg||'發生錯誤');el.classList.add('show')}
function clearError(el){el.textContent='';el.classList.remove('show')}
function normalize(payload){const raw=Array.isArray(payload)?payload:(payload?.topics||payload?.data||[]);return raw.map((t,i)=>({id:t.id||`topic-${i+1}`,title:t.title||'未命名焦點',category:t.category||'醫療時事',summary:t.summary||'',why:t.why||'',publishedAt:t.publishedAt||'',majorMediaCount:Number(t.majorMediaCount||0),extensionTerms:Array.isArray(t.extensionTerms)?t.extensionTerms:[],sources:Array.isArray(t.sources)?t.sources:[],literature:Array.isArray(t.literature)?t.literature:[]}));}
function renderList(){if(!topics.length){grid.innerHTML='<div class="empty glass" style="grid-column:1/-1">目前沒有符合門檻的醫療焦點。</div>';return}grid.innerHTML=topics.map((t,i)=>`<article class="card glass" data-i="${i}" tabindex="0" role="button"><div class="meta"><span class="chip">${esc(t.category)}</span><span class="chip purple">${Number(t.majorMediaCount||t.sources.length)} 個來源</span></div><h2>${esc(t.title)}</h2><p>${esc(t.summary||t.why||'點擊查看來源、文獻與 AI Writer。')}</p></article>`).join('');grid.querySelectorAll('[data-i]').forEach(el=>{const open=()=>openTopic(topics[Number(el.dataset.i)]);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
async function load(force=false){if(busy)return;busy=true;refreshBtn.disabled=true;clearError(listError);setStatus(force?'正在重新掃描近 24 小時新聞…':'正在讀取今日醫療焦點…');try{const fn=window.parent?.signwellMedicalNewsWorkspace||window.parent?.signwellMedicalNewsScan;if(typeof fn!=='function')throw new Error('CMS bridge 尚未就緒，請從 SIGN WELL CMS 的「時事新聞建議」分頁開啟。');const data=await fn({hours:24,limit:5,minMajorMedia:2,force:Boolean(force),fast:!force,includeLiterature:force});topics=normalize(data);renderList();setStatus(topics.length?`已就緒 · ${topics.length} 個焦點`:'掃描完成 · 目前沒有符合門檻的焦點','ready')}catch(e){grid.innerHTML='';setStatus('載入失敗','error');error(listError,e?.message||e)}finally{busy=false;refreshBtn.disabled=false}}
function sourceRows(t){const rows=(t.sources||[]).filter(s=>safeUrl(s.originalUrl||s.url||s.link)!=='#');if(!rows.length)return '<div class="empty">暫無可用原始來源。</div>';return rows.map((s,i)=>{const u=safeUrl(s.originalUrl||s.url||s.link);return `<a class="source" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><div><strong>[${i+1}] ${esc(s.canonicalName||s.name||s.source||'來源')} · ${esc(s.title||s.headline||t.title)}</strong><small>${esc(s.snippet||'')}</small></div><span>↗</span></a>`}).join('')}
function literatureRows(t){const rows=(t.literature||[]).filter(x=>safeUrl(x.url)!=='#');if(!rows.length)return '<div class="empty">尚未取得文獻；可按右上「更新 PubMed 文獻」。</div>';return rows.map((x,i)=>`<a class="source" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer"><div><strong>${esc(x.title||x.citation||`文獻 ${i+1}`)}</strong><small>${esc([x.journal,x.year,x.pmid&&('PMID '+x.pmid),x.doi&&('DOI '+x.doi)].filter(Boolean).join(' · '))}</small></div><span>↗</span></a>`).join('')}
function renderDetail(){if(!current)return;draft=null;variation=0;detailPaper.innerHTML=`<div class="eyebrow">${esc(current.category)} · ${Number(current.majorMediaCount||current.sources.length)} SOURCES</div><h2>${esc(current.title)}</h2><p class="summary">${esc(current.summary||current.why||'')}</p><section class="section"><h3>Source check</h3><div class="source-list">${sourceRows(current)}</div></section><section class="section"><h3>Related literature</h3><div class="lit-list" id="litList">${literatureRows(current)}</div></section><section class="writer"><div class="writer-head"><div><h3>SIGN WELL AI Writer</h3><div class="lead" style="font-size:12px">由父層 CMS 呼叫既有 Writer / Reviewer / Evidence Lock pipeline。</div></div><button class="btn primary" id="generateBtn" type="button">AI 一鍵生成範文</button></div><div class="draft" id="draft"></div><div class="draft-actions"><button class="btn" id="copyBtn" type="button" disabled>複製草稿</button><button class="btn" id="editorBtn" type="button" disabled>帶入文章編輯器</button><button class="btn primary" id="publishBtn" type="button" disabled>直接發布＋通知</button></div></section>`;
const generate=$('#generateBtn'),copy=$('#copyBtn'),editor=$('#editorBtn'),publish=$('#publishBtn');generate.onclick=()=>generateDraft(generate,copy,editor,publish);copy.onclick=()=>copyDraft();editor.onclick=()=>sendDraft('editor');publish.onclick=()=>sendDraft('publish')}
function openTopic(t){current=t;listView.classList.add('hidden');detailView.classList.add('active');clearError(detailError);renderDetail();scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
async function refreshLiterature(){if(!current||busy)return;busy=true;literatureBtn.disabled=true;clearError(detailError);try{const fn=window.parent?.signwellMedicalNewsLiterature;if(typeof fn!=='function')throw new Error('CMS Literature bridge 尚未就緒');const r=await fn(current);current.literature=Array.isArray(r)?r:(r?.literature||r?.items||[]);const box=$('#litList');if(box)box.innerHTML=literatureRows(current)}catch(e){error(detailError,e?.message||e)}finally{busy=false;literatureBtn.disabled=false}}
function jobId(){try{return crypto.randomUUID()}catch(_){return 'swjob_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}}
async function generateDraft(btn,copy,editor,publish){if(!current||busy)return;busy=true;btn.disabled=true;clearError(detailError);btn.textContent='AI 生成中…';const box=$('#draft');box.textContent='正在執行 Writer → Reviewer → Evidence Lock…';try{const fn=window.parent?.signwellMedicalNewsGenerateAIArticle;if(typeof fn!=='function')throw new Error('CMS AI Writer bridge 尚未就緒');const result=await fn(current,{variation:variation++,jobId:jobId(),aiProfile:'gpt',reviewerProfile:'gemini',failoverEnabled:true});draft=result?.article||result?.draft||result;if(!draft||typeof draft!=='object')throw new Error('AI 回傳格式無法辨識');const html=String(draft.content||draft.html||'');box.innerHTML=html||`<strong>${esc(draft.title||current.title)}</strong><p>${esc(draft.excerpt||draft.summary||'已生成，請帶入編輯器查看完整內容。')}</p>`;copy.disabled=editor.disabled=publish.disabled=false;btn.textContent='重新生成另一版'}catch(e){box.textContent='';error(detailError,e?.message||e);btn.textContent='AI 一鍵生成範文'}finally{busy=false;btn.disabled=false}}
async function copyDraft(){if(!draft)return;const text=[draft.title||current?.title,draft.excerpt||'',String(draft.content||'').replace(/<[^>]+>/g,' ')].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(text)}catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
async function sendDraft(mode){if(!draft||busy)return;busy=true;clearError(detailError);try{const fn=window.parent?.signwellMedicalNewsCreateArticle;if(typeof fn!=='function')throw new Error('CMS article bridge 尚未就緒');const payload={...draft,title:draft.title||current.title,excerpt:draft.excerpt||draft.summary||'',content:draft.content||draft.html||'',references:Array.isArray(draft.references)?draft.references:[],tags:Array.isArray(draft.tags)?draft.tags:[],topicId:current.id,sources:current.sources};const r=await fn(payload,mode);if(r?.cancelled)return;if(r?.ok&&mode==='editor')return;if(r?.ok&&mode==='publish'){setStatus('已發布到時事探討','ready');return}throw new Error(r?.error||'操作未完成')}catch(e){error(detailError,e?.message||e)}finally{busy=false}}
refreshBtn.onclick=()=>load(true);backBtn.onclick=()=>{detailView.classList.remove('active');listView.classList.remove('hidden');current=null;draft=null};literatureBtn.onclick=refreshLiterature;addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='SIGNWELL_MEDICAL_WORKSPACE_READY'&&!topics.length)load(false)});load(false);
})();
</script>
<script src="assets/gpu-optimizer.js?build=r10-2-gpu" defer></script></body>
</html>
