name: Public Motion V11 Release QA
on:
  push:
    branches:
      - release/public-motion-v11-20261008
      - release/public-v11-cross-page-20261008
      - feature/public-motion-2k-gpu-outline-20261008
      - feature/public-mobile-editorial-polish-20261008
  pull_request:
    paths:
      - "index.html"
      - "assets/public-core.js"
      - "assets/public-motion*"
      - "qa/smoke-public-motion.mjs"
      - "qa/smoke-public-mobile.mjs"
      - "qa/verify-rendering-quality.mjs"
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.55.0 three@0.180.0
          npx playwright install --with-deps chromium
      - name: Verify GPU budget, 2K output and real outline geometry
        run: node qa/verify-rendering-quality.mjs
      - name: Smoke test Public desktop/mobile and WebGL output
        run: node qa/smoke-public-motion.mjs
      - name: Validate responsive layout at 320, 360, 390, 430 and 768px
        run: node qa/smoke-public-mobile.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-v11-browser-qa
          path: |
            qa-public-v11-*.png
            qa-public-v12-*.png
            qa-public-mobile-*.png
          if-no-files-found: ignore
