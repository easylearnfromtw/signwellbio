name: Public Motion V11 Release QA
on:
  push:
    branches:
      - release/public-motion-v11-20261008
      - release/public-v11-cross-page-20261008
  pull_request:
    paths:
      - "index.html"
      - "assets/public-core.js"
      - "assets/public-motion*"
      - "qa/smoke-public-motion.mjs"
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke test Public desktop/mobile and regression surfaces
        run: node qa/smoke-public-motion.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-v11-browser-qa
          path: qa-public-v11-*.png
          if-no-files-found: ignore
