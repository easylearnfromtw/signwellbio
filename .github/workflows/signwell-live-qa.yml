name: SIGN WELL Live E2E QA

on:
  push:
    paths:
      - '.github/workflows/signwell-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium

      - name: Run live QA
        env:
          PUBLIC_URL: https://easylearnfromtw.github.io/signwellbio/
          CMS_URL: https://easylearnfromtw.github.io/signwellbio/cms/
          GAS_URL: https://script.google.com/macros/s/AKfycbzmZXZSepxCD1jbfpjMxsnvn0nRl-xEpeXdJoTO-TZL6Z5Zk7T-OsVGpTkIxWaCh-Y/exec
        run: |
          cat > /tmp/live-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const publicUrl=process.env.PUBLIC_URL;
          const cmsUrl=process.env.CMS_URL;
          const gasUrl=process.env.GAS_URL;
          const report={startedAt:new Date().toISOString(),http:{},browser:{},summary:{errors:[],warnings:[]}};
          async function probe(name,url){
            try{
              const r=await fetch(url,{redirect:'follow'});
              const text=await r.text();
              report.http[name]={url:r.url,status:r.status,ok:r.ok,contentType:r.headers.get('content-type')||'',length:text.length,head:text.slice(0,1000)};
              if(!r.ok)report.summary.errors.push(name+' HTTP '+r.status);
              return {r,text};
            }catch(e){
              report.http[name]={url,error:String(e)};
              report.summary.errors.push(name+' fetch failed: '+String(e));
              return null;
            }
          }

          await probe('public',publicUrl);
          await probe('cms',cmsUrl);
          const pubData=await probe('public-data',publicUrl+'public-data.json');
          const articles=await probe('articles-index',publicUrl+'articles/index.json');
          await probe('topics-index',publicUrl+'topics/index.json');
          await probe('public-core',publicUrl+'assets/public-core.js');
          await probe('cms-config',cmsUrl+'analytics-config.js');
          await probe('cms-app',cmsUrl+'assets/bundles/cms-app.js');
          await probe('gas-health',gasUrl+'?action=health&qa='+Date.now());

          try{
            if(pubData?.text){
              const x=JSON.parse(pubData.text);
              report.summary.publicRevision=Number(x?.revision||0);
              report.summary.publicPublishedAt=String(x?.publishedAt||'');
              if(!x?.revision)report.summary.warnings.push('public-data revision is 0');
            }
          }catch(e){report.summary.errors.push('public-data invalid JSON');}
          try{
            if(articles?.text){
              const x=JSON.parse(articles.text);
              report.summary.articleCount=Array.isArray(x)?x.length:null;
              if(Array.isArray(x)&&x.length===0)report.summary.warnings.push('articles/index.json is empty');
            }
          }catch(e){report.summary.errors.push('articles/index invalid JSON');}

          const browser=await chromium.launch({headless:true});
          async function runPage(label,url,viewport){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const info={viewport,consoleErrors:[],pageErrors:[],failedRequests:[],httpErrors:[],overflow:null,title:'',url:''};
            page.on('console',m=>{if(m.type()==='error')info.consoleErrors.push(m.text())});
            page.on('pageerror',e=>info.pageErrors.push(String(e)));
            page.on('requestfailed',r=>info.failedRequests.push({url:r.url(),failure:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.status()>=400)info.httpErrors.push({url:r.url(),status:r.status()})});
            try{
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(2500);
              info.title=await page.title();
              info.url=page.url();
              info.overflow=await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,
                clientWidth:document.documentElement.clientWidth,
                horizontal:document.documentElement.scrollWidth>document.documentElement.clientWidth+2
              }));
              info.textSample=(await page.locator('body').innerText()).slice(0,1200);
              const safe=label.replace(/[^a-z0-9_-]/gi,'_');
              await page.screenshot({path:'qa-'+safe+'.png',fullPage:true});
              if(label.startsWith('public')){
                const hrefs=await page.locator('a[href]').evaluateAll(as=>as.map(a=>a.getAttribute('href')).filter(Boolean));
                info.internalLinks=[...new Set(hrefs.filter(h=>!h.startsWith('mailto:')&&!h.startsWith('tel:')&&!h.startsWith('#')).slice(0,30))];
              }
              if(label.startsWith('cms')){
                info.login={
                  lockVisible:await page.locator('#lockScreen').isVisible().catch(()=>false),
                  passwordVisible:await page.locator('#pinInput').isVisible().catch(()=>false),
                  loginButtonVisible:await page.locator('#unlockBtn').isVisible().catch(()=>false),
                  backendEndpoint:await page.evaluate(()=>window.SIGNWELL_BACKEND?.endpoint||'').catch(()=> '')
                };
              }
            }catch(e){info.fatal=String(e);report.summary.errors.push(label+' browser fatal: '+String(e));}
            report.browser[label]=info;
            await context.close();
          }

          await runPage('public-desktop',publicUrl,{width:1440,height:1000});
          await runPage('public-mobile',publicUrl,{width:390,height:844});
          await runPage('cms-desktop',cmsUrl,{width:1440,height:1000});
          await runPage('cms-mobile',cmsUrl,{width:390,height:844});

          // Follow first few same-site Public links in a real browser.
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const navInfo=[];
          page.on('pageerror',e=>report.summary.errors.push('nav pageerror: '+String(e)));
          try{
            await page.goto(publicUrl,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1500);
            const links=await page.locator('a[href]').evaluateAll((as,base)=>{
              const out=[];
              for(const a of as){
                try{
                  const u=new URL(a.href,base);
                  if(u.origin===new URL(base).origin && u.pathname.startsWith('/signwellbio/') && !out.includes(u.href))out.push(u.href);
                }catch{}
              }
              return out.slice(0,8);
            },publicUrl);
            for(const u of links){
              try{
                const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(600);
                navInfo.push({url:u,status:r?.status()||0,title:await page.title(),h1:await page.locator('h1').first().innerText().catch(()=> '')});
              }catch(e){navInfo.push({url:u,error:String(e)});}
            }
          }catch(e){report.summary.warnings.push('public nav walk failed: '+String(e));}
          report.browser.publicNavigation=navInfo;
          await context.close();
          await browser.close();

          for(const [label,info] of Object.entries(report.browser)){
            if(info?.overflow?.horizontal)report.summary.errors.push(label+' has horizontal overflow');
            if(info?.pageErrors?.length)report.summary.errors.push(label+' page errors: '+info.pageErrors.length);
            const meaningful404=(info?.httpErrors||[]).filter(x=>x.status===404);
            if(meaningful404.length)report.summary.errors.push(label+' 404 resources: '+meaningful404.length);
            if(info?.consoleErrors?.length)report.summary.warnings.push(label+' console errors: '+info.consoleErrors.length);
          }

          report.finishedAt=new Date().toISOString();
          report.summary.ok=report.summary.errors.length===0;
          fs.writeFileSync('live-qa-report.json',JSON.stringify(report,null,2));
          fs.writeFileSync('live-qa-summary.txt',[
            'SIGN WELL Live E2E QA',
            'OK: '+report.summary.ok,
            'Errors: '+report.summary.errors.length,
            ...report.summary.errors.map(x=>'ERROR: '+x),
            'Warnings: '+report.summary.warnings.length,
            ...report.summary.warnings.map(x=>'WARN: '+x),
            'Article count: '+String(report.summary.articleCount),
            'Public revision: '+String(report.summary.publicRevision)
          ].join('\n'));
          console.log(fs.readFileSync('live-qa-summary.txt','utf8'));
          EOF
          node /tmp/live-qa.mjs

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signwell-live-qa
          path: |
            live-qa-report.json
            live-qa-summary.txt
            qa-*.png
          retention-days: 7
